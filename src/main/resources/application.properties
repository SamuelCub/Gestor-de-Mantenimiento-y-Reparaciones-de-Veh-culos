# Configuración del Servidor Web
server.port=8080

# Configuración de Base de Datos MySQL (JDBC Nativo con HikariCP)
spring.datasource.url=jdbc:mysql://localhost:3306/taller_mecanico_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del Pool de Conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Archivos estáticos de frontend servidos automáticamente desde /static
spring.web.resources.static-locations=classpath:/static/

# Configuración de JSON (Jackson)
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Europe/Madrid
